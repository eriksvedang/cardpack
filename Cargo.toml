[package]
name = "cardpack"
version = "0.1.0"
edition = "2024"
description = "Pack a directory of images onto A2/A3/A4 PDF pages"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
lopdf = { version = "0.45.0", default-features = false }

[profile.release]
opt-level = 3
